<script type="module">
import {
  activateGlobe,
  controlsVisible,
  copyFor,
  createUiState,
  isActivationKey,
  isDoubleTap,
  nextLanguage,
  pauseAutoRotation,
  restoreSession,
  serializeSession,
  setControlsIntent,
  shouldAutoRotate,
} from './scripts/globe-ui-state.mjs';
import {
  createVoxelGrid,
  loadLandTopology,
  projectSurfacePoint,
  selectGridDensity,
} from './scripts/voxel-globe-renderer.mjs';
import { createWebGlVoxelRenderer } from './scripts/webgl-voxel-globe.mjs';

(() => {
  const canvas = document.getElementById('globeCanvas');
  const overlay = document.getElementById('globeOverlay');
  const stage = document.getElementById('globeStage');
  const loading = document.getElementById('globeLoading');
  const langToggle = document.getElementById('langToggle');
  const hint = document.getElementById('interactionHint');
  const locationLabel = document.getElementById('globeLocationLabel');
  const locationName = document.getElementById('globeLocationName');
  const locationNav = document.getElementById('globeLocationNav');
  const locationButtons = [...document.querySelectorAll('#globeLocationNav [data-location-id]')];
  const zoomOut = document.getElementById('zoomOut');
  const resetButton = document.getElementById('resetView');
  const zoomIn = document.getElementById('zoomIn');
  const controls = document.getElementById('globeControls');
  const portalGate = document.getElementById('portalGate');
  const portalLabel = document.getElementById('portalLabel');
  const uiStatus = document.getElementById('uiStatus');
  const transitionVeil = document.getElementById('transitionVeil');
  if (!canvas || !overlay || !stage || !loading || !langToggle || !hint || !locationLabel || !locationName || !locationNav || locationButtons.length !== 3 || !zoomOut || !resetButton || !zoomIn || !controls || !portalGate || !portalLabel || !uiStatus || !transitionVeil) return;

  const DATA_URL = 'data/world.geojson';
  const TEXTURE_URL = 'assets/earth-texture-v2.png';
  const TEX_W = 720, TEX_H = 360, RENDER_SIZE = 360, TAU = Math.PI * 2;
  const MIN_ZOOM = 0.78, MAX_ZOOM = 1.3, MAX_RENDER_ZOOM = 1.1;
  const DEFAULT_VIEW = {yaw:-0.436, pitch:-0.08, zoom:1};
  const LOCATIONS = [
    {id:'guangzhou', name:{zh:'广州', en:'Guangzhou'}, lat:23.129, lon:113.264},
    {id:'indianapolis', name:{zh:'印第安纳波利斯', en:'Indianapolis'}, lat:39.768, lon:-86.158},
    {id:'toronto', name:{zh:'多伦多', en:'Toronto'}, lat:43.653, lon:-79.383}
  ];
  const SESSION_KEY = 'earth-portal-view-v3';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
  function readStoredSession(){
    try{return sessionStorage.getItem(SESSION_KEY);}catch{return null;}
  }
  const restoredState = restoreSession(readStoredSession());
  let state = {
    ...createUiState({reducedMotion}),
    ...(restoredState || {}),
    reducedMotion,
    selectedLocationId:null,
    hoverLocationId:null,
  };
  const pointers = new Map();
  const drag = {id:null,x:0,y:0,startX:0,startY:0,moved:false,locationId:null};
  const pinch = {distance:0,zoom:1};
  let textureData = null;
  let voxelCells = [];
  let gridDensityKey = '';
  let motionFrame = 0;
  let lastMotionTime = 0;
  let activationFrame = 0;
  let lastTouchTap = {time:Number.NaN,x:0,y:0};
  let touchControlsTimer = 0;
  let loadFailed = false;

  const webGlRenderer = createWebGlVoxelRenderer(canvas);
  const overlayCtx = overlay.getContext('2d', {alpha:true});
  const textureCanvas = document.createElement('canvas');
  textureCanvas.width = TEX_W; textureCanvas.height = TEX_H;
  const textureCtx = textureCanvas.getContext('2d', {alpha:true, willReadFrequently:true});
  overlayCtx.imageSmoothingEnabled = false;
  textureCtx.imageSmoothingEnabled = false;

  function lonLatToTexture(lon,lat){return {x:(lon+180)/360*TEX_W,y:(90-lat)/180*TEX_H};}
  function pathRing(target,ring){
    if(!ring || !ring.length)return;
    const first=lonLatToTexture(ring[0][0],ring[0][1]);target.moveTo(Math.round(first.x),Math.round(first.y));
    for(let i=1;i<ring.length;i++){const q=lonLatToTexture(ring[i][0],ring[i][1]);target.lineTo(Math.round(q.x),Math.round(q.y));}
    target.closePath();
  }
  function fillGeometry(target,geometry){
    if(!geometry)return;
    if(geometry.type==='Polygon'){
      target.beginPath();geometry.coordinates.forEach(ring=>pathRing(target,ring));target.fill('evenodd');
    }else if(geometry.type==='MultiPolygon'){
      geometry.coordinates.forEach(poly=>{target.beginPath();poly.forEach(ring=>pathRing(target,ring));target.fill('evenodd');});
    }
  }
  function hardenLand(){
    const image=textureCtx.getImageData(0,0,TEX_W,TEX_H), pixels=image.data, mask=new Uint8Array(TEX_W*TEX_H);
    for(let i=0;i<mask.length;i++){
      const p=i*4;
      if(pixels[p+3]>=32){mask[i]=1;pixels[p]=115;pixels[p+1]=155;pixels[p+2]=96;pixels[p+3]=255;}
      else{pixels[p+3]=0;}
    }
    textureCtx.putImageData(image,0,0);
    return mask;
  }
  function addTerrainPixels(){
    const palette=['#6f9b62','#789f5f','#8dad63','#9bae70','#5f8b5e','#b3ba7b','#4e7959'];
    textureCtx.save();textureCtx.globalCompositeOperation='source-atop';
    for(let y=0;y<TEX_H;y+=2){
      for(let x=0;x<TEX_W;x+=2){
        const n=(x*13+y*29+x*y)%41;
        if(n<6){textureCtx.fillStyle=palette[(x*3+y+n)%palette.length];textureCtx.fillRect(x,y,1+(n%2),1+(n%3===0?1:0));}
      }
    }
    textureCtx.fillStyle='#d5d7a2';[[18,12],[21,13],[55,9],[58,10],[70,15],[72,16],[10,18],[12,19],[80,31],[83,30]].forEach(([x,y])=>textureCtx.fillRect(x,y,2,2));
    textureCtx.restore();
  }
  function addPixelCoast(mask){
    const image=textureCtx.getImageData(0,0,TEX_W,TEX_H), pixels=image.data;
    for(let y=0;y<TEX_H;y++){
      for(let x=0;x<TEX_W;x++){
        const i=y*TEX_W+x;if(!mask[i])continue;
        const edge=x===0||y===0||x===TEX_W-1||y===TEX_H-1||!mask[i-1]||!mask[i+1]||!mask[i-TEX_W]||!mask[i+TEX_W];
        if(edge){const p=i*4;pixels[p]=38;pixels[p+1]=84;pixels[p+2]=73;pixels[p+3]=255;}
      }
    }
    textureCtx.putImageData(image,0,0);
  }
  function buildTexture(geo){
    textureCtx.clearRect(0,0,TEX_W,TEX_H);textureCtx.fillStyle='#739b60';
    geo.features.forEach(feature=>fillGeometry(textureCtx,feature.geometry));
    const mask=hardenLand();addTerrainPixels();addPixelCoast(mask);
    textureData=textureCtx.getImageData(0,0,TEX_W,TEX_H).data;
  }
  function buildTextureFromImage(image){
    textureCtx.clearRect(0,0,TEX_W,TEX_H);
    textureCtx.drawImage(image,0,0,TEX_W,TEX_H);
    const imageData=textureCtx.getImageData(0,0,TEX_W,TEX_H),pixels=imageData.data,mask=new Uint8Array(TEX_W*TEX_H);
    for(let i=0;i<mask.length;i++){
      const p=i*4,r=pixels[p],g=pixels[p+1],b=pixels[p+2];
      const land=r>35&&g>b+12&&r>b+18;
      if(land){mask[i]=1;pixels[p+3]=255;}
      else{pixels[p]=0;pixels[p+1]=0;pixels[p+2]=0;pixels[p+3]=0;}
    }
    textureCtx.putImageData(imageData,0,0);addTerrainPixels();addPixelCoast(mask);
    textureData=textureCtx.getImageData(0,0,TEX_W,TEX_H).data;
  }
  function locationVector(location){
    const lat=location.lat*Math.PI/180,lon=location.lon*Math.PI/180,cosLat=Math.cos(lat);
    return {x:cosLat*Math.sin(lon),y:Math.sin(lat),z:cosLat*Math.cos(lon)};
  }
  function projectLocation(location){
    const point=projectSurfacePoint(locationVector(location),{
      yaw:state.yaw,
      pitch:state.pitch,
      center:RENDER_SIZE/2,
      radius:globeRadius(),
    },true);
    if(!point||point.depth<=0.04)return null;
    return {location,view:{z:point.depth},x:point.x,y:point.y,depth:point.depth};
  }
  function renderZoom(){return Math.min(state.zoom,MAX_RENDER_ZOOM);}
  function globeRadius(){return RENDER_SIZE*0.43*renderZoom();}
  function syncCanvasScale(){
    const scale=state.zoom/renderZoom();
    canvas.style.transform=`scale(${scale})`;
    overlay.style.transform=`scale(${scale})`;
    locationNav.style.transform=`scale(${scale})`;
  }
  function visibleLocations(){
    return LOCATIONS.map(projectLocation).filter(Boolean).filter(item=>!state.selectedLocationId||item.location.id===state.selectedLocationId);
  }
  function hitLocation(event){
    const rect=canvas.getBoundingClientRect(),scale=RENDER_SIZE/rect.width;
    const px=(event.clientX-rect.left)*scale,py=(event.clientY-rect.top)*scale;
    return visibleLocations().sort((a,b)=>b.depth-a.depth).find(item=>Math.hypot(item.x-px,item.y-py)<=Math.max(9,Math.round(11/state.zoom)))?.location||null;
  }
  function sampleTexture(lon,lat){
    let u=lon/TAU+0.5;u=u-Math.floor(u);
    const v=Math.max(0,Math.min(0.999999,0.5-lat/Math.PI));
    const x=Math.max(0,Math.min(TEX_W-1,Math.floor(u*TEX_W))),y=Math.max(0,Math.min(TEX_H-1,Math.floor(v*TEX_H)));
    const p=(y*TEX_W+x)*4;return [textureData[p],textureData[p+1],textureData[p+2],textureData[p+3]];
  }
  function rebuildVoxelGrid(force=false){
    if(!textureData)return false;
    const density=selectGridDensity(window.innerWidth);
    const nextKey=`${density.longitudeSegments}x${density.latitudeSegments}`;
    if(!force&&nextKey===gridDensityKey&&voxelCells.length)return false;
    voxelCells=createVoxelGrid({
      ...density,
      isLand:(lon,lat)=>sampleTexture(lon,lat)[3]>0,
    });
    if(webGlRenderer)webGlRenderer.setInstances(voxelCells,density);
    gridDensityKey=nextKey;
    return true;
  }
  function drawLocationMarker(item){
    const unit=Math.max(2,Math.round(state.zoom*2)),px=Math.round(item.x),py=Math.round(item.y),selected=item.location.id===state.selectedLocationId;
    const blink=selected&&!state.reducedMotion?(0.68+0.32*(0.5+0.5*Math.sin(performance.now()/1200*Math.PI*2))):1;
    overlayCtx.save();overlayCtx.globalAlpha=blink;
    overlayCtx.fillStyle='#d7654f';
    overlayCtx.fillRect(px-2*unit,py-2*unit,4*unit,3*unit);
    overlayCtx.fillRect(px-unit,py+unit,2*unit,2*unit);
    overlayCtx.fillStyle='#f0ebd0';overlayCtx.fillRect(px-unit,py-unit,2*unit,2*unit);
    if(selected){
      overlayCtx.fillStyle='#d5d7a2';
      overlayCtx.fillRect(px-3*unit,py-3*unit,6*unit,unit);
      overlayCtx.fillRect(px-3*unit,py+2*unit,6*unit,unit);
      overlayCtx.fillRect(px-3*unit,py-2*unit,unit,4*unit);
      overlayCtx.fillRect(px+2*unit,py-2*unit,unit,4*unit);
    }
    overlayCtx.restore();
  }
  function syncGlobeLocationButtons(items){
    const layoutScale=RENDER_SIZE/160;
    const layouts={
      guangzhou:{dx:-7*layoutScale,dy:5*layoutScale},
      indianapolis:{dx:16*layoutScale,dy:13*layoutScale},
      toronto:{dx:-14*layoutScale,dy:-14*layoutScale}
    };
    locationButtons.forEach(button=>{
      const item=items.find(candidate=>candidate.location.id===button.dataset.locationId);
      button.hidden=!item;
      if(!item)return;
      const layout=layouts[item.location.id];
      button.style.left=`${(item.x+layout.dx)/RENDER_SIZE*100}%`;
      button.style.top=`${(item.y+layout.dy)/RENDER_SIZE*100}%`;
    });
  }
  function render(){
    if(!textureData)return;
    if(!voxelCells.length)rebuildVoxelGrid(true);
    syncCanvasScale();
    syncSelectionVisibility();
    overlayCtx.clearRect(0,0,RENDER_SIZE,RENDER_SIZE);
    if(webGlRenderer)webGlRenderer.draw({yaw:state.yaw,pitch:state.pitch,zoom:renderZoom()});
    const locations=visibleLocations();
    locations.forEach(drawLocationMarker);
    syncGlobeLocationButtons(locations);
  }
  function saveSessionView(){
    try{sessionStorage.setItem(SESSION_KEY,serializeSession(state));}catch{}
  }
  function setZoom(nextZoom){
    state={...state,zoom:Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,nextZoom))};
    render();saveSessionView();
  }
  function resetView(){
    state={...state,...DEFAULT_VIEW};
    clearLocationSelection();saveSessionView();
  }
  function selectedLocation(){return LOCATIONS.find(location=>location.id===state.selectedLocationId)||null;}
  function syncLocationLabel(){
    const location=selectedLocation(),english=state.language==='en';
    locationLabel.hidden=!location;
    locationName.textContent=location?location.name[state.language]:'';
    locationNav.setAttribute('aria-label',english?'Location selection':'地点选择');
    locationButtons.forEach(button=>{
      const item=LOCATIONS.find(location=>location.id===button.dataset.locationId);
      if(!item)return;
      button.textContent=item.name[state.language];
      button.setAttribute('aria-label',`${english?'Select ':'选择'}${item.name[state.language]}`);
      button.setAttribute('aria-pressed',String(item.id===state.selectedLocationId));
      button.disabled=!state.active;
      button.tabIndex=state.active?0:-1;
    });
  }
  function updateHint(){
    const location=LOCATIONS.find(item=>item.id===state.hoverLocationId);
    const copy=copyFor(state.language,coarsePointer);
    hint.textContent=location&&state.active?location.name[state.language]:(state.active?copy.activeHint:copy.dormantHint);
  }
  function syncSelectionVisibility(){
    if(!state.selectedLocationId)return;
    const location=selectedLocation();
    if(!location){
      state.selectedLocationId=null;state.hoverLocationId=null;syncLocationLabel();updateHint();
    }
  }
  function clearLocationSelection(){
    state.selectedLocationId=null;state.hoverLocationId=null;syncLocationLabel();updateHint();render();
  }
  function selectLocation(location){
    if(!state.active||!location)return;
    state.selectedLocationId=location.id;state.hoverLocationId=location.id;syncLocationLabel();updateHint();render();
  }
  function selectLocationById(id){selectLocation(LOCATIONS.find(location=>location.id===id)||null);}
  function setLanguage(){
    const english=state.language==='en',copy=copyFor(state.language,coarsePointer);
    document.documentElement.lang=english?'en':'zh-CN';
    langToggle.textContent=copy.languageToggle;
    langToggle.setAttribute('aria-pressed',String(english));
    portalLabel.textContent=copy.portalLabel;
    portalGate.setAttribute('aria-label',english?'Enter all works':'进入全部作品');
    controls.setAttribute('aria-label',english?'Globe view controls':'地球视图控制');
    zoomIn.setAttribute('aria-label',english?'Zoom in':'放大');
    resetButton.textContent=english?'Reset':'重置';
    resetButton.setAttribute('aria-label',english?'Reset globe view':'重置地球视角');
    zoomOut.setAttribute('aria-label',english?'Zoom out':'缩小');
    loading.textContent=loadFailed?copy.loadError:copy.loading;
    syncLocationLabel();updateHint();syncActivationUi();
    if(textureData)render();
    saveSessionView();
  }
  function syncControlsVisibility(){
    const visible=controlsVisible(state);
    controls.hidden=!visible;
    controls.setAttribute('aria-hidden',String(!visible));
  }
  function setControls(source,visible){
    state=setControlsIntent(state,source,visible);
    syncControlsVisibility();
  }
  function syncActivationUi(){
    const english=state.language==='en';
    stage.classList.toggle('is-active',state.active);
    stage.setAttribute('aria-label',state.active
      ?(english?'Active pixel globe. Drag to rotate.':'已唤醒的像素地球，可拖动旋转')
      :(english?'Dormant pixel globe. Double-click or press Enter to wake.':'休眠中的像素地球，双击或按回车键唤醒'));
    syncControlsVisibility();syncLocationLabel();updateHint();
  }
  function activateFromInput(){
    if(state.active)return;
    const initialZoom=state.zoom,activated=activateGlobe(state),targetZoom=activated.zoom;
    state=state.reducedMotion?activated:{...activated,zoom:initialZoom};
    if(stage.contains(document.activeElement))state=setControlsIntent(state,'focus',true);
    uiStatus.textContent=state.language==='en'?'The globe is awake':'地球已唤醒';
    syncActivationUi();render();saveSessionView();
    if(!state.reducedMotion&&targetZoom>initialZoom){
      const startedAt=performance.now(),duration=320;
      if(activationFrame)cancelAnimationFrame(activationFrame);
      const step=(now)=>{
        const progress=Math.min(1,(now-startedAt)/duration),eased=1-Math.pow(1-progress,3);
        state={...state,zoom:initialZoom+(targetZoom-initialZoom)*eased};
        render();
        if(progress<1)activationFrame=requestAnimationFrame(step);
        else{activationFrame=0;saveSessionView();}
      };
      activationFrame=requestAnimationFrame(step);
    }
  }
  function motionLoop(now){
    const elapsed=Math.max(0,now-lastMotionTime),rotationElapsed=Math.min(80,elapsed);
    const auto=textureData&&shouldAutoRotate(state,now);
    const blinking=textureData&&Boolean(state.selectedLocationId)&&!state.reducedMotion;
    const interval=auto?48:(blinking?120:Number.POSITIVE_INFINITY);
    if(textureData&&elapsed>=interval){
      if(auto)state={...state,yaw:state.yaw+rotationElapsed*0.00005};
      render();lastMotionTime=now;
    }else if(!textureData||interval===Number.POSITIVE_INFINITY){
      lastMotionTime=now;
    }
    motionFrame=requestAnimationFrame(motionLoop);
  }
  function runPortalPreview(){
    const copy=copyFor(state.language,coarsePointer);
    if(state.reducedMotion){uiStatus.textContent=copy.portalPending;return;}
    portalGate.classList.add('is-entering');
    transitionVeil.classList.add('is-active');
    window.setTimeout(()=>{
      portalGate.classList.remove('is-entering');
      transitionVeil.classList.remove('is-active');
      uiStatus.textContent=copy.portalPending;
    },450);
  }
  function distanceBetween(){
    const values=[...pointers.values()];if(values.length<2)return 0;return Math.hypot(values[0].x-values[1].x,values[0].y-values[1].y);
  }
  function updateDrag(event){
    const rect=canvas.getBoundingClientRect();
    const yaw=state.yaw+(event.clientX-drag.x)/rect.width*Math.PI*1.35;
    const pitch=Math.max(-1.25,Math.min(1.25,state.pitch+(event.clientY-drag.y)/rect.height*Math.PI*0.9));
    state={...state,yaw,pitch};drag.x=event.clientX;drag.y=event.clientY;render();
  }
  canvas.addEventListener('pointerdown',(event)=>{
    if(!state.active)return;
    event.preventDefault();canvas.setPointerCapture(event.pointerId);pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    state=pauseAutoRotation(state,performance.now());
    if(event.pointerType==='touch'){
      window.clearTimeout(touchControlsTimer);setControls('touch',true);
    }
    if(pointers.size===1){
      const location=hitLocation(event);
      drag.id=event.pointerId;drag.x=event.clientX;drag.y=event.clientY;drag.startX=event.clientX;drag.startY=event.clientY;drag.moved=false;drag.locationId=location?.id||null;stage.classList.add('dragging');
    }
    if(pointers.size===2){pinch.distance=distanceBetween();pinch.zoom=state.zoom;drag.id=null;drag.locationId=null;drag.moved=true;}
  });
  canvas.addEventListener('pointermove',(event)=>{
    if(!state.active)return;
    if(!pointers.has(event.pointerId))return;event.preventDefault();pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    if(pointers.size>=2){const current=distanceBetween();if(pinch.distance>0)setZoom(pinch.zoom*current/pinch.distance);}
    else if(drag.id===event.pointerId){
      const distance=Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY);
      if(distance>6)drag.moved=true;
      if(drag.moved)updateDrag(event);
      else{const location=hitLocation(event);state.hoverLocationId=location?.id||null;updateHint();}
    }
  });
  function endPointer(event,allowClick){
    if(!state.active){
      if(allowClick&&event.pointerType==='touch'){
        const now=performance.now(),distance=Math.hypot(event.clientX-lastTouchTap.x,event.clientY-lastTouchTap.y);
        if(isDoubleTap(lastTouchTap.time,now)&&distance<=32)activateFromInput();
        lastTouchTap={time:now,x:event.clientX,y:event.clientY};
      }
      return;
    }
    const wasSingle=pointers.size===1&&drag.id===event.pointerId,wasTap=allowClick&&wasSingle&&!drag.moved,locationId=drag.locationId;
    pointers.delete(event.pointerId);
    if(wasTap){if(locationId)selectLocationById(locationId);else clearLocationSelection();}
    if(drag.id===event.pointerId)drag.id=null;
    if(pointers.size===1){
      const [id,value]=pointers.entries().next().value;drag.id=id;drag.x=value.x;drag.y=value.y;drag.startX=value.x;drag.startY=value.y;drag.moved=true;drag.locationId=null;
    }
    if(pointers.size<2)pinch.distance=0;
    if(pointers.size===0){
      stage.classList.remove('dragging');drag.locationId=null;drag.moved=false;
      state=pauseAutoRotation(state,performance.now());saveSessionView();
      if(!state.selectedLocationId){state.hoverLocationId=null;updateHint();}
      if(event.pointerType==='touch'){
        touchControlsTimer=window.setTimeout(()=>setControls('touch',false),1400);
      }
    }
  }
  canvas.addEventListener('pointerup',event=>endPointer(event,true));
  canvas.addEventListener('pointercancel',event=>endPointer(event,false));
  canvas.addEventListener('pointerleave',()=>{state.hoverLocationId=null;updateHint();});
  canvas.addEventListener('wheel',(event)=>{
    event.preventDefault();
    if(!state.active)return;
    state=pauseAutoRotation(state,performance.now());setZoom(state.zoom-event.deltaY*0.001);
  },{passive:false});
  canvas.addEventListener('contextmenu',(event)=>event.preventDefault());
  stage.addEventListener('dblclick',event=>{event.preventDefault();activateFromInput();});
  stage.addEventListener('keydown',event=>{
    if(event.target!==stage||!isActivationKey(event.key))return;
    event.preventDefault();activateFromInput();
  });
  stage.addEventListener('pointerenter',()=>{if(state.active)setControls('hover',true);});
  stage.addEventListener('pointerleave',()=>setControls('hover',false));
  stage.addEventListener('focusin',()=>{if(state.active)setControls('focus',true);});
  stage.addEventListener('focusout',()=>window.setTimeout(()=>{
    if(!stage.contains(document.activeElement)&&!controls.contains(document.activeElement))setControls('focus',false);
  },0));
  controls.addEventListener('focusin',()=>setControls('focus',true));
  controls.addEventListener('focusout',()=>window.setTimeout(()=>{
    if(!stage.contains(document.activeElement)&&!controls.contains(document.activeElement))setControls('focus',false);
  },0));
  langToggle.addEventListener('click',()=>{state={...state,language:nextLanguage(state.language)};setLanguage();});
  zoomOut.addEventListener('click',()=>{if(state.active)setZoom(state.zoom-0.1);});
  resetButton.addEventListener('click',()=>{if(state.active)resetView();});
  zoomIn.addEventListener('click',()=>{if(state.active)setZoom(state.zoom+0.1);});
  locationButtons.forEach(button=>button.addEventListener('click',()=>selectLocationById(button.dataset.locationId)));
  portalGate.addEventListener('click',runPortalPreview);
  window.addEventListener('resize',()=>{
    if(webGlRenderer)webGlRenderer.resize();
    if(rebuildVoxelGrid())render();
    else if(textureData)render();
  });

  const loadGeoJson=()=>fetch(DATA_URL).then(response=>{
    if(!response.ok)throw new Error('Map data request failed');
    return response.json();
  });
  const loadTextureImage=()=>new Promise((resolve,reject)=>{
    const textureImage=new Image();
    textureImage.decoding='async';
    textureImage.onload=()=>resolve(textureImage);
    textureImage.onerror=()=>reject(new Error('Texture request failed'));
    textureImage.src=TEXTURE_URL;
  });
  loadLandTopology({loadGeoJson,loadTexture:loadTextureImage}).then(({source,data})=>{
    if(!webGlRenderer)throw new Error('WebGL2 unavailable');
    if(source==='geojson')buildTexture(data);
    else buildTextureFromImage(data);
    rebuildVoxelGrid(true);loading.style.display='none';render();
  }).catch(()=>{
    loadFailed=true;loading.textContent=copyFor(state.language,coarsePointer).loadError;loading.classList.add('error');
  });
  setLanguage();
  syncActivationUi();
  if(!motionFrame)motionFrame=requestAnimationFrame(motionLoop);
})();
</script>

    </section>
    <noscript class="site-noscript">需要启用 JavaScript 才能旋转地球。</noscript>
  </main>
