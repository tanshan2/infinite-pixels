<!doctype html>
<html lang="zh-CN">
<head>

  <title>体素地球视觉对照</title>

</head>
<body>
  <main class="grid">
    <section class="panel"><h2>参考图</h2><div class="image"><img src="assets/earth-model-v2.png" alt="参考体素地球"></div></section>
    <section class="panel"><h2>网站实现</h2><div class="image implementation"><img src="implementation-step-fix-default-674x912.png" alt="网站体素地球实现"></div></section>
  </main>
</body>
</html>
